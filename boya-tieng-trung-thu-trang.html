<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boya Từ Vựng</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
/* Layout: một cột học tập — chọn bài ở trên, ba chế độ (thẻ / bảng từ / trò chơi), thẻ có ô 田字格 như vở tập viết */
:root{
  --paper:#FFFFFF; --surface:#FFFFFF; --sunk:#EEF2FA; --ink:#1B2233; --muted:#5A6275; --line:#DDE2EA;
  --sage:#2B4C9B; --sun:#E1E7F5; --sun-soft:#F1F4FC; --rose:#C0646E; --rose-soft:#F6E1E3;
  --accent:#2B4C9B; --accent-ink:#FFFFFF; --accent-soft:#E1E7F5;
  --jade:#2B4C9B; --jade-ink:#FFFFFF; --jade-soft:#DFE6F6;
  --bad:#C2573F; --bad-soft:#F9E3DC; --mark-bg:#D9E2F6; --mark-fg:#1B2A55;
  --grid:rgba(43,76,155,.32); --grid-strong:rgba(43,76,155,.62);
  --shadow:0 1px 2px rgba(23,32,28,.06),0 10px 28px rgba(23,32,28,.08);
  --f-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-hz:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --f-py:"Noto Sans","Segoe UI","Helvetica Neue",Arial,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#11151E; --surface:#192030; --sunk:#212A3C; --ink:#E8ECF4; --muted:#9CA6BB; --line:#2C3548;
  --sage:#5F80D0; --sun:#D9CFB8; --sun-soft:#232B3D; --rose:#E68E97; --rose-soft:#3D2226;
  --accent:#8FA9E8; --accent-ink:#0D1428; --accent-soft:#1E2B4A;
  --jade:#8FA9E8; --jade-ink:#0D1428; --jade-soft:#1E2B4A;
  --bad:#EC8F7A; --bad-soft:#3E231D; --mark-bg:#26376A; --mark-fg:#E8ECF4;
  --grid:rgba(143,169,232,.3); --grid-strong:rgba(143,169,232,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11151E; --surface:#192030; --sunk:#212A3C; --ink:#E8ECF4; --muted:#9CA6BB; --line:#2C3548;
  --sage:#5F80D0; --sun:#D9CFB8; --sun-soft:#232B3D; --rose:#E68E97; --rose-soft:#3D2226;
  --accent:#8FA9E8; --accent-ink:#0D1428; --accent-soft:#1E2B4A;
  --jade:#8FA9E8; --jade-ink:#0D1428; --jade-soft:#1E2B4A;
  --bad:#EC8F7A; --bad-soft:#3E231D; --mark-bg:#26376A; --mark-fg:#E8ECF4;
  --grid:rgba(143,169,232,.3); --grid-strong:rgba(143,169,232,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.hz{font-family:var(--f-hz);font-weight:500}
.py{font-family:var(--f-py)}
.app{max-width:940px;margin:0 auto;display:flex;flex-direction:column;gap:20px}

/* header */
.top{display:flex;align-items:center;gap:14px}
.seal{width:46px;height:46px;flex:none;border:0;background:var(--sage);border-radius:8px;color:#FFFFFF;box-shadow:5px 5px 0 var(--rose);display:grid;place-items:center;
  font-family:var(--f-hz);font-weight:700;font-size:26px;line-height:1;transform:rotate(-4deg)}
.top h1{margin:0;color:var(--accent);font-size:clamp(20px,4.5vw,24px);font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.top p{margin:0;color:var(--muted);font-size:13.5px}

/* lesson tabs */
.lessons{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:4px;scrollbar-width:thin}
.lessons .ltab{flex:1 0 168px;scroll-snap-align:start}
.ltab{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:12px 14px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0;transition:border-color .15s,transform .15s}
.ltab:hover{border-color:var(--grid-strong)}
.ltab[aria-current="true"]{border-color:var(--sage);background:var(--sun-soft)}
.ltab .ln{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ltab[aria-current="true"] .ln{color:var(--accent)}
.ltab .lz{font-family:var(--f-hz);font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ltab .lv{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:5px;border-radius:9px;background:var(--sunk);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--sage);border-radius:9px;transition:width .3s}

/* lesson head */
.lhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-top:6px;border-top:1px solid var(--line)}
.lhead .k{font-family:var(--f-hz);color:var(--rose);font-size:15px;font-weight:700;letter-spacing:.15em}
.lhead h2{margin:2px 0 0;font-family:var(--f-hz);font-size:clamp(30px,6vw,40px);line-height:1.15;font-weight:700}
.lhead .sub{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;color:var(--muted)}
.lhead .sub .py{font-size:15px;color:var(--ink)}
.stats{display:flex;gap:18px;font-size:13px;color:var(--muted)}
.stats b{display:block;font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums;font-weight:700}

/* mode tabs */
.modes{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:12px;width:max-content;max-width:100%}
.modes button{border:0;background:transparent;padding:8px 16px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.modes button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* buttons */
.btn{border:1.5px solid var(--line);background:var(--surface);padding:10px 18px;border-radius:11px;font-weight:600;font-size:14.5px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:active:not(:disabled),.btn.picked{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.jade:hover,.btn.red:hover{color:var(--accent-ink);filter:brightness(1.08)}
.btn.jade{background:var(--jade);border-color:var(--jade);color:var(--jade-ink)}
.btn.red{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:default}
.icon-btn{width:38px;height:38px;flex:none;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{color:var(--accent);border-color:var(--accent)}
.icon-btn svg{width:18px;height:18px}

/* flashcards */
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 12px;font-size:13.5px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.chip{border:1.5px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:10px;font-size:13.5px;font-weight:500}
.check{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--muted);cursor:pointer}
.check input{accent-color:var(--jade);width:16px;height:16px}

.stage{perspective:1400px;margin-top:4px}
.fc{position:relative;height:clamp(360px,58vh,430px);cursor:pointer;outline:none;border-radius:20px}
.fc-inner{position:absolute;inset:0;transition:transform .5s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.fc.flipped .fc-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1.5px solid var(--line);border-radius:20px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:28px 22px;overflow:auto}
.back{transform:rotateY(180deg);justify-content:flex-start;align-items:stretch;gap:14px}
.face .corner{position:absolute;top:14px;right:14px}
.face .tag{position:absolute;top:18px;left:18px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.face .tag.name{color:var(--accent)}
.tap{font-size:12.5px;color:var(--muted)}
.known-dot{position:absolute;bottom:16px;left:18px;font-size:12px;font-weight:600;color:var(--jade);display:flex;align-items:center;gap:5px}
.known-dot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--jade)}

.tzg-row{display:flex;gap:6px;justify-content:center}
.tzg{position:relative;width:var(--box);height:var(--box);border:1.5px solid var(--grid-strong);display:grid;place-items:center;
  font-family:var(--f-hz);font-weight:500;font-size:calc(var(--box)*.7);line-height:1;color:var(--ink)}
.tzg::before{content:"";position:absolute;inset:0;pointer-events:none;background:
  repeating-linear-gradient(to right,var(--grid) 0 5px,transparent 5px 10px) center/100% 1px no-repeat,
  repeating-linear-gradient(to bottom,var(--grid) 0 5px,transparent 5px 10px) center/1px 100% no-repeat}
.tzg span{position:relative}
.front-mean{font-size:clamp(22px,4.5vw,28px);font-weight:600;text-align:center;max-width:26ch;text-wrap:balance;line-height:1.3}

.b-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding-right:44px}
.b-hz{font-family:var(--f-hz);font-size:44px;font-weight:700;line-height:1.1}
.b-py{font-family:var(--f-py);font-size:24px;color:var(--accent);font-weight:500}
.b-info{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:0;font-size:15px}
.b-info dt{color:var(--muted);font-size:13px;padding-top:2px}
.b-info dd{margin:0;min-width:0}
.b-info .hv{font-style:italic}
.ex{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:2px}
.ex .lbl{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:2px}
.ex-zh{font-family:var(--f-hz);font-size:20px}
.ex-zh mark{background:var(--mark-bg);color:var(--mark-fg);padding:0 2px;border-radius:3px}
.ex-py{font-family:var(--f-py);font-size:13.5px;color:var(--muted)}
.ex-vi{font-size:14.5px}

.fc-nav{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:14px}
.nav-btn{width:52px;height:52px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;box-shadow:0 2px 0 var(--line)}
.nav-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.nav-btn:disabled{opacity:.35;cursor:default}
.nav-btn svg{width:22px;height:22px}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600;min-width:4.5em;text-align:center}
.fc-mark{display:flex;justify-content:center;gap:10px;margin-top:14px}
.fc-mark .btn{min-width:140px}
.hint{font-size:12.5px;color:var(--muted);text-align:center;margin:12px 0 0}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:var(--r);padding:36px 20px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}

/* word list */
.wgroup{display:flex;flex-direction:column;gap:6px}
.wgroup h3{margin:10px 0 4px;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.wlist{list-style:none;margin:0;padding:0;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r)}
.row{display:grid;grid-template-columns:5.2em minmax(0,1fr) auto;gap:14px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.r-hz{font-family:var(--f-hz);font-size:24px;font-weight:600;line-height:1.2}
.r-l1{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
.r-py{font-family:var(--f-py);color:var(--accent);font-weight:500}
.r-hv{font-style:italic;color:var(--muted);font-size:13.5px}
.r-t{font-size:12px;color:var(--muted)}
.r-m{font-size:14.5px}
.r-act{display:flex;gap:6px}
.kbtn{height:38px;padding:0 12px;border-radius:19px;border:1.5px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.kbtn[aria-pressed="true"]{background:var(--jade-soft);border-color:var(--jade);color:var(--jade)}

/* games picker */
.gsec h3{margin:6px 0 10px;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.gcard{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;text-align:left;display:grid;grid-template-columns:52px minmax(0,1fr);gap:4px 14px;align-items:start;transition:border-color .15s,transform .15s}
.gcard:hover{border-color:var(--rose);transform:translateY(-2px)}
.gcard .gz{grid-row:span 3;width:52px;height:52px;background:var(--sun-soft);border:1.5px solid var(--sage);border-radius:8px;display:grid;place-items:center;font-family:var(--f-hz);font-weight:700;font-size:19px;color:var(--rose);letter-spacing:-.02em}
.gcard b{font-size:15.5px}
.gcard span{font-size:13.5px;color:var(--muted);line-height:1.45}
.gcard .best{font-size:12px;font-weight:600;color:var(--jade);margin-top:4px}
.gcard .best.none{color:var(--muted);font-weight:500}

/* game shell */
.game{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:18px clamp(14px,3vw,26px) 24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.g-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.g-top h3{margin:0;font-size:17px;flex:1;min-width:0}
.g-top h3 .hz{color:var(--rose);margin-left:6px}
.back-btn{border:0;background:var(--sunk);padding:7px 12px;border-radius:9px;font-size:13.5px;font-weight:600}
.g-stat{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.prog{height:6px;background:var(--sunk);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--sage);transition:width .3s}

.q-prompt{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:14px 0 6px}
.q-ask{font-size:13px;color:var(--muted);font-weight:500}
.q-zh{font-family:var(--f-hz);font-size:clamp(24px,5vw,32px);line-height:1.4;font-weight:500}
.q-vi{font-size:clamp(18px,3.6vw,22px);font-weight:600;max-width:32ch;text-wrap:balance}
.q-sub{font-size:14px;color:var(--muted)}
.blank{display:inline-block;min-width:2.2em;border-bottom:2.5px solid var(--accent);margin:0 3px;color:var(--accent)}
.linkish{border:0;background:none;color:var(--accent);font-size:13px;font-weight:600;padding:2px 4px;text-decoration:underline;text-underline-offset:3px}
.big-play{width:84px;height:84px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.big-play svg{width:34px;height:34px}

.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opts.one{grid-template-columns:minmax(0,1fr)}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 14px;font-size:15.5px;text-align:center;min-height:58px;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt.hzopt{font-family:var(--f-hz);font-size:28px;font-weight:500;padding:10px}
.opt.pyopt{font-family:var(--f-py);font-size:20px}
.opt.zhs{font-family:var(--f-hz);font-size:19px;text-align:left}
.opt.vis{text-align:left}
.opt.ok{border-color:var(--jade);background:var(--jade-soft);color:var(--ink)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.q-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:46px;flex-wrap:wrap}
.fb{font-size:14.5px;font-weight:600;min-width:0;flex:1}
.fb.good{color:var(--jade)} .fb.bad{color:var(--bad)}
.fb small{display:block;font-weight:400;color:var(--muted);font-size:13.5px}
.fb .py{font-weight:500}

/* match */
.match{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:10px 14px}
.mcol{display:flex;flex-direction:column;gap:9px}
.mbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 12px;min-height:54px;font-size:14.5px;text-align:left;transition:all .15s}
.mbtn.h{font-family:var(--f-hz);font-size:24px;text-align:center}
.mbtn.sel{border-color:var(--sage);background:var(--sun-soft)}
.mbtn.done{border-color:var(--jade);background:var(--jade-soft);opacity:.55;cursor:default}
.mbtn.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}

/* memory */
.mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;perspective:1000px}
.mcard{aspect-ratio:4/5;max-width:100%;border:0;padding:0;background:none;position:relative}
.mcard .mi{position:absolute;inset:0;transition:transform .4s;transform-style:preserve-3d}
.mcard.open .mi,.mcard.got .mi{transform:rotateY(180deg)}
.mcard .mf,.mcard .mb{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;padding:8px;text-align:center}
.mcard .mf{background:var(--accent);color:var(--accent-ink);font-family:var(--f-hz);font-weight:700;font-size:26px;opacity:.92;
  background-image:repeating-linear-gradient(45deg,transparent 0 10px,rgba(255,255,255,.08) 10px 20px)}
.mcard .mb{background:var(--surface);border:1.5px solid var(--line);transform:rotateY(180deg);font-size:13.5px;line-height:1.3;overflow:hidden}
.mcard .mb.h{font-family:var(--f-hz);font-size:clamp(22px,5vw,32px)}
.mcard.got .mb{border-color:var(--jade);background:var(--jade-soft)}

/* build */
.slots{min-height:64px;border:1.5px dashed var(--line);border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.slots.ok{border-style:solid;border-color:var(--jade);background:var(--jade-soft)}
.slots.bad{border-style:solid;border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
.slots .ph{color:var(--muted);font-size:13.5px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:52px}
.tok{font-family:var(--f-hz);font-size:22px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 14px;box-shadow:0 2px 0 var(--line)}
.tok:hover:not(:disabled){border-color:var(--ink)}
.tok:disabled{cursor:default}
.b-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* result */
.result{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:12px 0}
.rseal{width:96px;height:96px;border:3.5px solid var(--accent);border-radius:12px;display:grid;place-items:center;color:var(--accent);font-family:var(--f-hz);font-weight:700;font-size:44px;line-height:1;transform:rotate(-6deg);animation:stamp .45s cubic-bezier(.2,1.4,.4,1) both}

.missed h4{margin:0 0 6px;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.missed ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const sample=(a,n)=>shuffle(a).slice(0,n);
const PUNCT=/^[，。！？、《》：；“”]$/;
const allToks=s=>s.t.split(" ");
const toks=s=>allToks(s).filter(x=>!PUNCT.test(x));
const zhOf=s=>allToks(s).join("");
const plain=p=>p.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const ICON_SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';

/* lưu tiến độ trên trình duyệt */
const KEY="boya1-tuvung-v1";
let DB={known:{},best:{},unk:{}};
try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);DB.known=o.known||{};DB.best=o.best||{};DB.unk=o.unk||{}}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
const isKnown=w=>!!DB.known[w.id];
function setKnown(w,v){if(v){DB.known[w.id]=1;delete DB.unk[w.id]}else{delete DB.known[w.id];DB.unk[w.id]=1}save()}

/* phát âm */
const TTS={ok:("speechSynthesis" in window),voice:null};
function pickVoice(){try{const vs=speechSynthesis.getVoices();TTS.voice=vs.find(v=>/zh[-_]CN/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang))||vs.find(v=>/^cmn/i.test(v.lang))||null}catch(e){}}
if(TTS.ok){pickVoice();try{speechSynthesis.onvoiceschanged=pickVoice}catch(e){}}
/* đọc chậm vừa phải, ngắt nghỉ ở dấu câu: mỗi vế câu là một lượt đọc riêng */
function speak(text){if(!TTS.ok)return false;try{speechSynthesis.cancel();
  const parts=text.replace(/[《》“”]/g,"").match(/[^，。！？、；：]+[，。！？、；：]?/g)||[];
  parts.splice(0,parts.length,...parts.map(x=>x.trim()).filter(Boolean));
  parts.forEach(seg=>{const u=new SpeechSynthesisUtterance(seg);u.lang="zh-CN";if(TTS.voice)u.voice=TTS.voice;u.rate=.68;u.pitch=1;speechSynthesis.speak(u)});
  return true}catch(e){return false}}

const S={li:0,mode:"cards",deck:[],idx:0,flipped:false,reverse:false,onlyNew:false,shuffled:false,game:null,cleanup:null};

function boxFor(n){return n<=2?"min(124px,30vw)":n===3?"min(100px,24vw)":"min(80px,18vw)"}
function tzg(h){return `<div class="tzg-row" lang="zh-CN" style="--box:${boxFor([...h].length)}">${[...h].map(c=>`<span class="tzg"><span>${c}</span></span>`).join("")}</div>`}
function exampleFor(lesson,w){
  return lesson.sents.find(s=>allToks(s).includes(w.h))||lesson.sents.find(s=>zhOf(s).includes(w.h));
}
function markZh(s,h){
  const t=allToks(s);
  if(t.includes(h))return t.map(x=>x===h?`<mark>${x}</mark>`:x).join("");
  return esc(zhOf(s)).replace(h,`<mark>${h}</mark>`);
}

function buildDeck(){

function renderCards(){
  const v=$("#view");
  const tools=`<div class="tools">
    <div class="seg" role="group" aria-label="Mặt trước của thẻ"><button data-rev="0" class="${S.reverse?"":"on"}">Chữ Hán trước</button><button data-rev="1" class="${S.reverse?"on":""}">Nghĩa trước</button></div>

  if(!S.deck.length){
    v.innerHTML=tools+`<div class="empty" style="margin-top:14px"><div class="rseal j sm" lang="zh-CN">好</div><b>Bạn đã thuộc hết từ của bài này.</b><span style="color:var(--muted)">Thử các trò chơi để củng cố, hoặc ôn lại toàn bộ.</span><div class="r-actions"><button class="btn" id="allAgain">Ôn lại toàn bộ</button><button class="btn red" id="toGames">Sang trò chơi</button></div></div>`;
    bindTools();$("#allAgain").onclick=()=>{S.onlyNew=false;buildDeck();renderCards()};$("#toGames").onclick=()=>{S.mode="games";renderModes();renderView()};return;
  }
  const w=S.deck[S.idx],lesson=L(),ex=exampleFor(lesson,w);
  const tag=`<span class="tag ${w.t==="name"?"name":""}">${TYPES[w.t]}</span>`;
  const kd=isKnown(w)?`<span class="known-dot">Đã thuộc</span>`:"";
  const spk=`<button class="icon-btn corner spk" aria-label="Nghe phát âm">${ICON_SPK}</button>`;
  const front=S.reverse
    ?`${tag}${kd}<div class="front-mean">${esc(w.m)}</div><span class="tap">Chạm để xem chữ Hán</span>`
    :`${tag}${spk}${kd}${tzg(w.h)}<span class="tap">Chạm để xem nghĩa</span>`;

      <div class="fc-inner"><div class="face front">${front}</div><div class="face back">${back}</div></div></div></div>

    <div class="fc-mark"><button class="btn ${DB.unk[w.id]?"picked":""}" id="mNo" aria-pressed="${!!DB.unk[w.id]}">Chưa thuộc</button><button class="btn ${isKnown(w)?"picked":""}" id="mYes" aria-pressed="${isKnown(w)}">Đã thuộc ✓</button></div>
    <p class="hint">Phím tắt: Space lật thẻ · ← → chuyển thẻ · Enter nghe phát âm</p>`;
  bindTools();
  const fc=$("#fc");
  fc.onclick=e=>{if(e.target.closest(".spk"))return;flip()};
  v.querySelectorAll(".spk").forEach(b=>b.onclick=e=>{e.stopPropagation();speak(w.h)});
  $("#prev").onclick=()=>go(-1);$("#next").onclick=()=>go(1);
  const mark=(v,btn)=>{setKnown(w,v);$("#mYes").classList.toggle("picked",v);$("#mNo").classList.toggle("picked",!v);refreshProgress();setTimeout(advance,320)};
  $("#mYes").onclick=e=>mark(true);
  $("#mNo").onclick=e=>mark(false);
}
function flip(){S.flipped=!S.flipped;const fc=$("#fc");if(fc){fc.classList.toggle("flipped",S.flipped);fc.setAttribute("aria-label",S.flipped?"Lật thẻ về mặt trước":"Lật thẻ xem mặt sau")}}
function go(d){const n=S.idx+d;if(n<0||n>=S.deck.length)return;S.idx=n;S.flipped=false;renderCards();$("#fc")&&$("#fc").focus({preventScroll:true})}
function advance(){if(S.idx<S.deck.length-1){go(1)}else{
  if(S.onlyNew){buildDeck();renderCards()}else{renderCards()}}}
function bindTools(){
  document.querySelectorAll("[data-rev]").forEach(b=>b.onclick=()=>{S.reverse=b.dataset.rev==="1";S.flipped=false;renderCards()});
  $("#shuf").onclick=()=>{S.shuffled=!S.shuffled;buildDeck();renderCards()};
  $("#onlyNew").onchange=e=>{S.onlyNew=e.target.checked;buildDeck();renderCards()};
}
document.addEventListener("keydown",e=>{
  if(S.mode!=="cards"||!S.deck.length)return;
  if(e.target.matches("input,textarea"))return;
  if(e.key===" "){e.preventDefault();flip()}
  else if(e.key==="ArrowRight")go(1);
  else if(e.key==="ArrowLeft")go(-1);
  else if(e.key==="Enter"&&e.target.id==="fc"){speak(S.deck[S.idx].h)}
});

/* kết quả */
function finish({gid,score,total,missed=[],label,pct}){
  setProg(1);
  pct=pct!=null?pct:score/total;
  label=label||`${score}/${total}`;
  const key=L().n+":"+gid,prev=DB.best[key];
  if(!prev||pct>prev.pct){DB.best[key]={pct,label};save()}
  const [ch,cls,msg]=pct>=.9?["优","","Xuất sắc! Bạn nắm rất chắc phần này."]:pct>=.7?["良","j","Khá tốt. Ôn lại vài từ còn sai là ổn."]:["加油","sm","Cố lên! Xem lại thẻ từ rồi chơi lại nhé."];
  const uniq=[];missed.forEach(m=>{if(m&&!uniq.find(u=>u.zh===m.zh))uniq.push(m)});
  $("#gBody").innerHTML=`<div class="result"><div class="rseal ${cls}" lang="zh-CN">${ch}</div><div class="rscore">${label}</div><p>${msg}</p>
    ${uniq.length?`<div class="missed"><h4>Cần ôn lại</h4><ul>${uniq.map(m=>`<li><span class="hz" lang="zh-CN">${m.zh}</span><span class="py" style="color:var(--accent)">${m.py}</span><span>${esc(m.vi)}</span></li>`).join("")}</ul></div>`:""}
    <div class="r-actions"><button class="btn red" id="again">Chơi lại</button><button class="btn" id="other">Chọn trò khác</button></div></div>`;
  $("#again").onclick=()=>startGame(gid);
  $("#other").onclick=()=>{S.game=null;renderView()};
  $("#again").focus({preventScroll:true});
}
const missW=w=>({zh:w.h,py:w.p,vi:w.g});
const missS=s=>({zh:zhOf(s),py:s.p,vi:s.v});

/* ===================== BỘ MÁY TRẮC NGHIỆM ===================== */
function quiz(gid,qs){
  let i=0,score=0;const missed=[];const body=$("#gBody");
  function show(){
    if(i>=qs.length)return finish({gid,score,total:qs.length,missed});
    const q=qs[i];setProg(i/qs.length);setStat(`Câu ${i+1}/${qs.length} · Đúng ${score}`);
    body.innerHTML=`<div class="q-prompt">${q.prompt}</div><div class="opts ${q.cls||""}">${q.options.map((o,k)=>`<button class="opt ${q.ocls||""}" data-k="${k}" ${q.olang?`lang="${q.olang}"`:""}>${o.html}</button>`).join("")}</div>
      <div class="q-foot"><div class="fb" id="fb" aria-live="polite"></div><button class="btn red" id="qNext" hidden>${i===qs.length-1?"Xem kết quả":"Câu tiếp ›"}</button></div>`;
    q.mount&&q.mount(body);
    body.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const o=q.options[+b.dataset.k];
      body.querySelectorAll(".opt").forEach((x,k)=>{x.disabled=true;if(q.options[k].ok)x.classList.add("ok")});
      const fb=$("#fb");
      if(o.ok){score++;fb.className="fb good";fb.innerHTML=`Chính xác!${q.reveal?`<small>${q.reveal}</small>`:""}`}
      else{b.classList.add("bad");missed.push(q.miss);fb.className="fb bad";fb.innerHTML=`Chưa đúng.${q.reveal?`<small>${q.reveal}</small>`:""}`}
      q.after&&q.after();
      setStat(`Câu ${i+1}/${qs.length} · Đúng ${score}`);
      const n=$("#qNext");n.hidden=false;n.focus({preventScroll:true});n.onclick=()=>{i++;show()};
    });
  }
  show();
}

/* --- Chọn thanh điệu --- */
const MARKS=["̄","́","̌","̀"];
function toneVariants(p){
  const nfd=p.normalize("NFD");const pos=[];
  for(let i=0;i<nfd.length;i++)if(MARKS.includes(nfd[i]))pos.push(i);
  if(!pos.length)return[];
  const set=new Set([p]);let guard=0;
  while(set.size<4&&guard++<80){
    let s=nfd;
    const changes=pos.length>1&&Math.random()<.35?2:1;
    sample(pos,changes).forEach(ps=>{const others=MARKS.filter(m=>m!==s[ps]);s=s.slice(0,ps)+others[Math.floor(Math.random()*3)]+s.slice(ps+1)});
    set.add(s.normalize("NFC"));
  }
  return[...set];
}
function gTone(){
  const ws=L().words.filter(w=>toneVariants(w.p).length>=3);
  const qs=sample(ws,Math.min(8,ws.length)).map(w=>({
    miss:missW(w),ocls:"pyopt",
    options:shuffle(toneVariants(w.p)).map(p=>({html:p,ok:p===w.p})),
    prompt:`<span class="q-ask">Chọn pinyin có thanh điệu đúng</span>${tzg(w.h)}<span class="q-sub">${esc(w.g)}</span>`,
    reveal:`<span class="py">${w.p}</span> — bấm loa để nghe lại`,
    after(){speak(w.h);const fb=$("#fb");fb.insertAdjacentHTML("beforeend",` <button class="icon-btn" style="display:inline-grid;vertical-align:middle;width:32px;height:32px" id="rs" aria-label="Nghe lại">${ICON_SPK}</button>`);$("#rs").onclick=()=>speak(w.h)}
  }));
  quiz("tone",qs);
}

/* --- Điền từ vào câu --- */
function gFill(){
  const lesson=L(),ws=lesson.words,map={};ws.forEach(w=>map[w.h]=w);
  const per=lesson.sents.map(s=>{const t=allToks(s);const idx=t.map((x,i)=>map[x]?i:-1).filter(i=>i>=0);return idx.length?{s,i:idx[Math.floor(Math.random()*idx.length)]}:null}).filter(Boolean);
  const qs=sample(per,Math.min(8,per.length)).map(({s,i})=>{
    const t=allToks(s),w=map[t[i]];
    let pool=ws.filter(x=>x!==w&&x.t!==w.t&&!t.includes(x.h));
    if(pool.length<3)pool=ws.filter(x=>x!==w&&!t.includes(x.h));
    const ds=sample(pool,3);
    const shown=t.map((x,k)=>k===i?`<span class="blank">　</span>`:x).join("");
    return {miss:missS(s),cls:"hzgrid",ocls:"hzopt",olang:"zh-CN",
      options:shuffle([w,...ds]).map(x=>({html:x.h,ok:x===w})),
      prompt:`<span class="q-ask">Chọn từ còn thiếu</span><div class="q-zh" lang="zh-CN" id="fz">${shown}</div><span class="q-sub">${s.v}</span>`,
      reveal:`<span class="py">${s.p}</span>`,
      after(){$("#fz").innerHTML=t.map((x,k)=>k===i?`<span class="blank" style="border-color:var(--jade);color:var(--jade)">${x}</span>`:x).join("");speak(zhOf(s))}};
  });
  quiz("fill",qs);
}

/* --- Dịch nghĩa câu --- */
function gTrans(){
  const ss=L().sents;
  const qs=sample(ss,Math.min(8,ss.length)).map((s,k)=>{
    const ds=sample(ss.filter(x=>x!==s&&x.v!==s.v&&zhOf(x)!==zhOf(s)),3);

        mount(){$("#ts").onclick=()=>speak(zhOf(s));$("#tpb").onclick=e=>{$("#tp").hidden=false;e.target.hidden=true}},

      reveal:`<span class="py">${s.p}</span>`,after(){speak(zhOf(s))}};
  });

/* --- Nối từ --- */
function gMatch(){
  const ws=shuffle(L().words);const rounds=[];
  for(let i=0;i<ws.length;i+=5)rounds.push(ws.slice(i,i+5));
  if(rounds.length>1&&rounds[rounds.length-1].length<3){const last=rounds.pop();rounds[rounds.length-1].push(...last)}
  let r=0,mistakes=0,done=0,sel=null;const t0=Date.now();const missed=[];
  const total=ws.length;
  const fmt=ms=>{const s=Math.floor(ms/1000);return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`};
  const tick=()=>setStat(`Lượt ${r+1}/${rounds.length} · Sai ${mistakes} · ${fmt(Date.now()-t0)}`);
  const iv=setInterval(tick,1000);S.cleanup=()=>clearInterval(iv);
  function round(){
    tick();setProg(done/total);
    const rw=rounds[r];
    $("#gBody").innerHTML=`<p class="q-ask" style="text-align:center;margin:0">Chọn một chữ Hán, rồi chọn nghĩa tương ứng</p>
      <div class="match"><div class="mcol">${shuffle(rw).map(w=>`<button class="mbtn h" lang="zh-CN" data-side="L" data-id="${w.id}">${w.h}</button>`).join("")}</div>
      <div class="mcol">${shuffle(rw).map(w=>`<button class="mbtn" data-side="R" data-id="${w.id}">${esc(w.g)}</button>`).join("")}</div></div>`;
    let left=rw.length;
    $("#gBody").querySelectorAll(".mbtn").forEach(b=>b.onclick=()=>{
      if(b.classList.contains("done"))return;
      if(b.dataset.side==="L")speak(rw.find(w=>w.id===b.dataset.id).h);
      if(!sel||sel.dataset.side===b.dataset.side){if(sel)sel.classList.remove("sel");sel=b;b.classList.add("sel");return}
      const a=sel;sel=null;a.classList.remove("sel");
      if(a.dataset.id===b.dataset.id){
        [a,b].forEach(x=>{x.classList.add("done");x.disabled=true});done++;left--;setProg(done/total);
        if(!left){if(++r<rounds.length)setTimeout(round,450);else{clearInterval(iv);S.cleanup=null;setTimeout(()=>finish({gid:"match",score:total,total,missed,pct:total/(total+mistakes),label:`${mistakes} lỗi · ${fmt(Date.now()-t0)}`}),450)}}
      }else{
        mistakes++;const w=rw.find(x=>x.id===(a.dataset.side==="L"?a.dataset.id:b.dataset.id));missed.push(missW(w));
        [a,b].forEach(x=>{x.classList.remove("wrong");void x.offsetWidth;x.classList.add("wrong")});
        setTimeout(()=>[a,b].forEach(x=>x.classList.remove("wrong")),500);tick();
      }
    });
  }
  round();
}

/* --- Lật thẻ trí nhớ --- */
function gMemory(){
  const ws=sample(L().words,6);
  const cards=shuffle(ws.flatMap(w=>[{w,k:"h"},{w,k:"m"}]));
  let open=[],moves=0,got=0,lock=false;
  setStat("Lượt lật: 0");setProg(0);
  $("#gBody").innerHTML=`<p class="q-ask" style="text-align:center;margin:0">Tìm 6 cặp chữ Hán – nghĩa</p><div class="mem">${cards.map((c,i)=>`<button class="mcard" data-i="${i}" aria-label="Thẻ úp ${i+1}"><span class="mi"><span class="mf" lang="zh-CN">博</span><span class="mb ${c.k==="h"?"h":""}" ${c.k==="h"?'lang="zh-CN"':""}>${c.k==="h"?c.w.h:esc(c.w.g)}</span></span></button>`).join("")}</div>`;
  $("#gBody").querySelectorAll(".mcard").forEach(b=>b.onclick=()=>{
    if(lock||b.classList.contains("open")||b.classList.contains("got"))return;
    const c=cards[+b.dataset.i];b.classList.add("open");b.setAttribute("aria-label",c.k==="h"?c.w.h:c.w.g);
    if(c.k==="h")speak(c.w.h);
    open.push(b);
    if(open.length===2){
      moves++;setStat(`Lượt lật: ${moves}`);
      const [a,d]=open,ca=cards[+a.dataset.i],cd=cards[+d.dataset.i];open=[];
      if(ca.w===cd.w&&ca.k!==cd.k){
        a.classList.add("got");d.classList.add("got");got++;setProg(got/6);
        if(got===6)setTimeout(()=>finish({gid:"memory",score:6,total:6,pct:Math.min(1,8/moves),label:`${moves} lượt`}),600);
      }else{lock=true;setTimeout(()=>{a.classList.remove("open");d.classList.remove("open");a.setAttribute("aria-label","Thẻ úp");d.setAttribute("aria-label","Thẻ úp");lock=false},950)}
    }
  });
}

/* --- Xếp câu --- */
function gBuild(){
  const pool=L().sents.filter(s=>!s.nb&&toks(s).length>=3);
  const qs=sample(pool,Math.min(6,pool.length));
  let i=0,score=0;const missed=[];
  function show(){
    if(i>=qs.length)return finish({gid:"build",score,total:qs.length,missed});
    setProg(i/qs.length);setStat(`Câu ${i+1}/${qs.length} · Đúng ${score}`);
    const s=qs[i],target=toks(s);
    let bank=target.map((w,k)=>({w,k}));let g=0;
    do{bank=shuffle(bank);g++}while(g<6&&bank.map(x=>x.w).join(" ")===target.join(" "));
    let ans=[],checked=false;
    const body=$("#gBody");
    body.innerHTML=`<div class="q-prompt"><span class="q-ask">Sắp xếp thành câu tiếng Trung</span><div class="q-vi">${esc(s.v)}</div></div>
      <div class="slots" id="slots" lang="zh-CN"></div><div class="bank" id="bank" lang="zh-CN"></div>
      <div class="q-foot"><div class="fb" id="fb" aria-live="polite"></div><div class="b-actions"><button class="btn" id="clr">Làm lại</button><button class="btn red" id="chk" disabled>Kiểm tra</button></div></div>`;
    function draw(){
      $("#slots").innerHTML=ans.length?ans.map((x,k)=>`<button class="tok" data-a="${k}" ${checked?"disabled":""}>${x.w}</button>`).join(""):`<span class="ph">Chạm vào các từ bên dưới theo đúng thứ tự</span>`;
      $("#bank").innerHTML=bank.map((x,k)=>`<button class="tok" data-b="${k}" ${checked?"disabled":""}>${x.w}</button>`).join("");
      $("#chk").disabled=checked||bank.length>0;
      $("#slots").querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{bank.push(ans.splice(+b.dataset.a,1)[0]);draw()});
      $("#bank").querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{const x=bank.splice(+b.dataset.b,1)[0];ans.push(x);speak(x.w);draw()});
    }
    draw();
    $("#clr").onclick=()=>{if(checked)return;bank=bank.concat(ans);ans=[];draw()};
    $("#chk").onclick=()=>{
      checked=true;const got=ans.map(x=>x.w).join(" ");
      const ok=got===target.join(" ")||(s.alt||[]).includes(got);
      const fb=$("#fb"),sl=$("#slots");
      if(ok){score++;sl.classList.add("ok");fb.className="fb good";fb.innerHTML=`Chính xác!<small><span class="py">${s.p}</span></small>`}
      else{missed.push(missS(s));sl.classList.add("bad");fb.className="fb bad";fb.innerHTML=`Chưa đúng. Đáp án:<small><span class="hz" lang="zh-CN" style="font-size:18px;color:var(--ink)">${zhOf(s)}</span><br><span class="py">${s.p}</span></small>`}
      speak(zhOf(s));draw();setStat(`Câu ${i+1}/${qs.length} · Đúng ${score}`);
      const acts=body.querySelector(".b-actions");acts.innerHTML=`<button class="btn red" id="qNext">${i===qs.length-1?"Xem kết quả":"Câu tiếp ›"}</button>`;
      $("#qNext").onclick=()=>{i++;show()};$("#qNext").focus({preventScroll:true});
    };
  }
  show();
}

/* ===================== KHỞI ĐỘNG ===================== */
renderModes();
fromHash();
</script>
</body>
